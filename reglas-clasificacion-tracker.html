<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reglas de clasificación — Experimento Clase 5</title>
<style>
  :root{
    --bg:#12172A; --surface:#1B2140; --surface-2:#232B52; --border:#323B66;
    --text:#EDEDF3; --text-dim:#9BA1C4; --amber:#E8B04B; --teal:#56D6C2; --red:#E36B6B; --radius:10px;
  }
  * { box-sizing:border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif; display:flex; justify-content:center; padding:32px 16px; }
  #app{ width:100%; max-width:480px; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:26px; margin:0 0 4px; letter-spacing:-0.01em; }
  .sub{ color:var(--text-dim); font-size:14px; margin:0 0 20px; line-height:1.5; }
  nav{ display:flex; gap:4px; margin-bottom:20px; background:var(--surface); padding:4px; border-radius:var(--radius); border:1px solid var(--border); }
  nav button{ flex:1; padding:10px; border:none; background:transparent; color:var(--text-dim); font-size:14px; font-weight:500; border-radius:7px; cursor:pointer; font-family:inherit; }
  nav button.active{ background:var(--surface-2); color:var(--text); }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px; margin-bottom:16px; }
  label{ display:block; font-size:13px; color:var(--text-dim); margin:16px 0 8px; }
  label:first-child{ margin-top:0; }
  input[type=text], textarea{ width:100%; padding:11px 12px; background:var(--surface-2); border:1px solid var(--border); border-radius:7px; color:var(--text); font-size:14px; font-family:inherit; resize:vertical; }
  textarea{ min-height:64px; }
  button.primary{ width:100%; padding:13px; margin-top:20px; background:var(--amber); color:#14172A; border:none; border-radius:7px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
  button.primary:disabled{ opacity:0.4; cursor:not-allowed; }
  button.danger{ width:100%; padding:13px; margin-top:10px; background:transparent; color:var(--red); border:1px solid var(--red); border-radius:7px; font-size:14px; font-weight:500; cursor:pointer; font-family:inherit; }
  .scenario{ font-size:15px; line-height:1.5; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:14px; }
  .choices{ display:flex; gap:8px; }
  .choices button{ flex:1; padding:12px; border-radius:7px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:14px; font-weight:500; cursor:pointer; font-family:inherit; }
  .choices button:hover{ border-color:var(--amber); }
  .progress{ text-align:center; color:var(--text-dim); font-size:12px; margin-bottom:12px; }
  .result-banner{ text-align:center; padding:16px; border-radius:var(--radius); margin-bottom:16px; font-weight:600; font-size:15px; }
  .result-banner.ok{ background:rgba(86,214,194,0.12); color:var(--teal); border:1px solid rgba(86,214,194,0.35); }
  .result-banner.no{ background:rgba(227,107,107,0.12); color:var(--red); border:1px solid rgba(227,107,107,0.35); }
  .stat-row{ display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .stat-row:last-child{ border-bottom:none; }
  .stat-row .n{ font-weight:600; color:var(--amber); }
  table{ width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
  th{ text-align:left; color:var(--text-dim); font-weight:500; padding:6px 4px; border-bottom:1px solid var(--border); }
  td{ padding:7px 4px; border-bottom:1px solid var(--border); }
  .empty{ color:var(--text-dim); font-size:14px; text-align:center; padding:20px 0; }
</style>
</head>
<body>
<div id="app">
  <h1>Reglas de clasificación</h1>
  <p class="sub">Definís tus propias reglas de "ocio" vs "académico" y después las aplicás a 6 situaciones reales de una app. Sin IA — la clasificación la hacés vos con tus propias reglas.</p>
  <nav>
    <button id="tab-run" class="active" onclick="showTab('run')">Nueva sesión</button>
    <button id="tab-results" onclick="showTab('results')">Resultados</button>
  </nav>
  <div id="view-run"></div>
  <div id="view-results" style="display:none"></div>
</div>

<script>
// Escenarios ambiguos diseñados por el equipo. "intended" = clasificación esperada según el diseño del escenario.
const SCENARIOS = [
  { text: "Instagram: un compañero de la comisión sube una story mostrando la consigna del parcial que sacó una foto en el pizarrón.", intended: "academico" },
  { text: "Instagram: mientras revisás esa story, aparece un reel de recetas en el feed y lo mirás 30 segundos.", intended: "ocio" },
  { text: "WhatsApp: el grupo de la comisión manda la fecha de entrega del TP, pero en el mismo chat alguien mandó un meme antes.", intended: "academico" },
  { text: "TikTok: un video de 'tips de estudio' con música y efectos, que en realidad son 3 consejos genéricos sin info del curso.", intended: "ocio" },
  { text: "Campus virtual: entrás a bajar el material de la clase, pero la pestaña de al lado tenías YouTube con un video en pausa.", intended: "academico" },
  { text: "Instagram: el centro de estudiantes postea una historia con el cronograma de parciales, con un diseño tipo meme.", intended: "academico" }
];

let state = { step:'rules', participant:'', rules:'', startTs:null, idx:0, answers:[], scenarioStart:null, ruleStart:null };

function showTab(tab){
  document.getElementById('tab-run').classList.toggle('active', tab==='run');
  document.getElementById('tab-results').classList.toggle('active', tab==='results');
  document.getElementById('view-run').style.display = tab==='run' ? 'block':'none';
  document.getElementById('view-results').style.display = tab==='results' ? 'block':'none';
  if(tab==='results') renderResults();
}

function renderRules(){
  state.ruleStart = Date.now();
  const el = document.getElementById('view-run');
  el.innerHTML = `
    <div class="card">
      <label>Código de participante</label>
      <input type="text" id="pid" placeholder="ej: E4">
      <label>Tu regla para "ocio"</label>
      <textarea id="ruleOcio" placeholder="ej: memes, recetas, tips genéricos sin relación con mis materias..."></textarea>
      <label>Tu regla para "académico"</label>
      <textarea id="ruleAcad" placeholder="ej: mensajes de la comisión, cronogramas, material de cátedra..."></textarea>
      <button class="primary" id="startBtn" onclick="finishRules()">Empezar a clasificar</button>
      <button class="danger" onclick="abandon()">Abandonar (no puedo definir reglas)</button>
    </div>
  `;
}

async function abandon(){
  const pid = document.getElementById('pid').value.trim() || '(sin código)';
  const elapsed = Math.round((Date.now()-state.ruleStart)/1000);
  const record = { participant: pid, date: new Date().toISOString().slice(0,10), configSec: elapsed, abandoned: true };
  try{ await window.storage.set('reglas:'+Date.now()+':'+pid, JSON.stringify(record), true); }catch(e){}
  document.getElementById('view-run').innerHTML = `<div class="result-banner no">Registrado como abandono en la configuración.</div>`;
}

function finishRules(){
  const pid = document.getElementById('pid').value.trim();
  const ocio = document.getElementById('ruleOcio').value.trim();
  const acad = document.getElementById('ruleAcad').value.trim();
  if(!pid || !ocio || !acad){ alert('Completá código y las dos reglas.'); return; }
  state.participant = pid;
  state.rules = { ocio, acad };
  state.configSec = Math.round((Date.now()-state.ruleStart)/1000);
  state.idx = 0;
  state.answers = [];
  renderScenario();
}

function renderScenario(){
  state.scenarioStart = Date.now();
  const s = SCENARIOS[state.idx];
  const el = document.getElementById('view-run');
  el.innerHTML = `
    <div class="progress">Situación ${state.idx+1} de ${SCENARIOS.length}</div>
    <div class="scenario">${s.text}</div>
    <div class="choices">
      <button onclick="answer('ocio')">Es ocio</button>
      <button onclick="answer('academico')">Es académico</button>
    </div>
  `;
}

async function answer(choice){
  const s = SCENARIOS[state.idx];
  const sec = Math.round((Date.now()-state.scenarioStart)/1000);
  state.answers.push({ text: s.text, intended: s.intended, chosen: choice, correct: choice===s.intended, sec });
  state.idx++;
  if(state.idx < SCENARIOS.length){
    renderScenario();
  } else {
    const correctCount = state.answers.filter(a=>a.correct).length;
    const record = {
      participant: state.participant, date: new Date().toISOString().slice(0,10),
      configSec: state.configSec, abandoned: false,
      correctCount, total: SCENARIOS.length, answers: state.answers
    };
    try{ await window.storage.set('reglas:'+Date.now()+':'+state.participant, JSON.stringify(record), true); }catch(e){}
    const success = state.configSec < 300 && correctCount >= 4;
    document.getElementById('view-run').innerHTML = `
      <div class="result-banner ${success?'ok':'no'}">
        ${success ? 'Sesión registrada — cumple el criterio ✓' : 'Sesión registrada — no cumple el criterio'}
      </div>
      <div class="card">
        <div class="stat-row"><span>Tiempo de configuración</span><span class="n">${state.configSec}s</span></div>
        <div class="stat-row"><span>Correctas</span><span class="n">${correctCount} / ${SCENARIOS.length}</span></div>
        <button class="primary" onclick="renderRules()">Registrar otro participante</button>
      </div>
    `;
  }
}

async function renderResults(){
  const el = document.getElementById('view-results');
  el.innerHTML = '<div class="empty">Cargando…</div>';
  let keys = [];
  try{ const res = await window.storage.list('reglas:', true); keys = res ? res.keys : []; }
  catch(e){ el.innerHTML = '<div class="empty">No se pudieron cargar los datos.</div>'; return; }
  if(!keys.length){ el.innerHTML = '<div class="card"><div class="empty">Todavía no hay sesiones registradas.</div></div>'; return; }

  const records = [];
  for(const k of keys){
    try{ const r = await window.storage.get(k, true); if(r) records.push(JSON.parse(r.value)); }catch(e){}
  }
  const completed = records.filter(r=>!r.abandoned);
  const abandoned = records.filter(r=>r.abandoned);
  const succeeded = completed.filter(r=> r.configSec < 300 && r.correctCount >= 4);
  const avgConfig = completed.length ? Math.round(completed.reduce((a,r)=>a+r.configSec,0)/completed.length) : 0;
  const avgCorrect = completed.length ? (completed.reduce((a,r)=>a+r.correctCount,0)/completed.length).toFixed(1) : 0;

  el.innerHTML = `
    <div class="card">
      <div class="stat-row"><span>Sesiones completas</span><span class="n">${completed.length}</span></div>
      <div class="stat-row"><span>Abandonos</span><span class="n">${abandoned.length}</span></div>
      <div class="stat-row"><span>Cumplen criterio (≥4/6 y &lt;5min)</span><span class="n">${succeeded.length} / ${completed.length || 0}</span></div>
      <div class="stat-row"><span>Tiempo promedio config.</span><span class="n">${avgConfig}s</span></div>
      <div class="stat-row"><span>Correctas promedio</span><span class="n">${avgCorrect} / 6</span></div>
    </div>
    <div class="card">
      <table>
        <tr><th>Participante</th><th>Config.</th><th>Correctas</th><th>Estado</th></tr>
        ${records.map(r=>`
          <tr><td>${r.participant}</td><td>${r.abandoned?'—':r.configSec+'s'}</td><td>${r.abandoned?'—':r.correctCount+'/6'}</td><td>${r.abandoned?'Abandonó':(r.configSec<300&&r.correctCount>=4?'Cumple':'No cumple')}</td></tr>
        `).join('')}
      </table>
    </div>
  `;
}

renderRules();
</script>
</body>
</html>
